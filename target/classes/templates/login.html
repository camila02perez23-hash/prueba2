<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SIGPROD - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --rojo: #C0392B;
            --rojo-hover: #E74C3C;
            --blanco: #FFFFFF;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Gabarito', sans-serif;
            background: linear-gradient(135deg, #f8e8e6 0%, #f0f0f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo-titulo { font-size: 36px; font-weight: 900; color: var(--rojo); }
        .logo-empresa { font-size: 13px; color: #888; margin-top: 5px; }
        .alerta-error {
            background: rgba(192,57,43,0.1);
            color: #C0392B;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        label { display: block; margin-top: 15px; margin-bottom: 5px; font-weight: 500; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
        }
        button {
            width: 100%;
            background: var(--rojo);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover { background: var(--rojo-hover); }
        .register-link { text-align: center; margin-top: 20px; }
        a { color: var(--rojo); text-decoration: none; }
        .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #bbb; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <div class="logo-titulo">SIGPROD</div>
        <div class="logo-empresa">TechSoft Solutions S.A.S.</div>
    </div>

    <div th:if="${param.error}" class="alerta-error">
        ⚠️ Correo o contraseña incorrectos
    </div>

    <div th:if="${param.logout}" class="alerta-error" style="background:#d4edda; color:#155724;">
        ✅ Sesión cerrada correctamente
    </div>

    <form method="post" action="/login">
        <label>Correo electrónico</label>
        <input type="email" name="username" required autofocus>

        <label>Contraseña</label>
        <input type="password" name="password" required>

        <button type="submit">Iniciar Sesión</button>
    </form>

    <div class="register-link">
        ¿No tienes cuenta? <a href="/registro">Regístrate aquí</a>
    </div>

    <div class="footer">SIGPROD · UTS © 2026</div>
</div>
</body>
</html>
