<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>SIGPROD – Crear cuenta</title>
    <link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* ===== Mismos estilos que el login, no los repito por longitud ===== */
        :root {
            --rojo:        #C0392B;
            --rojo-hover:  #E74C3C;
            --rojo-oscuro: #96281B;
            --rojo-suave:  rgba(192, 57, 43, 0.15);
            --blanco:      #FFFFFF;
            --fondo:       #f5f5f5;
            --tarjeta:     #FFFFFF;
            --borde:       #e0e0e0;
            --borde-foco:  #C0392B;
            --input-bg:    #fafafa;
            --texto:       #1a1a1a;
            --texto-sub:   #888888;
            --sombra:      rgba(192, 57, 43, 0.20);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Gabarito', sans-serif;
            background: linear-gradient(135deg, #f8e8e6 0%, #f0f0f0 50%, #f8e8e6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: var(--tarjeta);
            border: 1px solid var(--borde);
            border-radius: 16px;
            padding: 44px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            animation: aparecer 0.4s ease both;
        }
        @keyframes aparecer {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .logo { text-align: center; margin-bottom: 32px; }
        .logo-titulo { font-size: 36px; font-weight: 900; color: var(--rojo); letter-spacing: -1px; }
        .logo-empresa { font-size: 13px; color: var(--texto-sub); font-weight: 500; margin-top: 6px; }
        .logo-linea { width: 40px; height: 3px; background: var(--rojo); border-radius: 2px; margin: 14px auto 0; opacity: 0.5; }
        .alerta {
            padding: 11px 15px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .alerta-error { background: rgba(192, 57, 43, 0.08); color: var(--rojo-oscuro); border: 1px solid rgba(192, 57, 43, 0.25); }
        .alerta-ok { background: rgba(39, 174, 96, 0.08); color: #1e8449; border: 1px solid rgba(39, 174, 96, 0.25); }
        label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 7px; margin-top: 18px; }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 11px 16px;
            background: var(--input-bg);
            border: 1.5px solid var(--borde);
            border-radius: 10px;
            font-family: 'Gabarito', sans-serif;
            font-size: 14px;
            color: var(--texto);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus {
            border-color: var(--borde-foco);
            background: var(--blanco);
            box-shadow: 0 0 0 3px var(--rojo-suave);
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: var(--rojo);
            color: var(--blanco);
            border: none;
            border-radius: 10px;
            font-family: 'Gabarito', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 26px;
            transition: background 0.2s, transform 0.15s;
            box-shadow: 0 4px 18px var(--sombra);
        }
        .btn-login:hover { background: var(--rojo-hover); transform: translateY(-1px); }
        .btn-login:active { background: var(--rojo-oscuro); transform: translateY(0); }
        .footer { text-align: center; margin-top: 24px; font-size: 12px; color: #bbb; font-weight: 500; }
        a { color: #C0392B; text-decoration: none; font-weight: 500; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <div class="logo-titulo">SIGPROD</div>
        <div class="logo-empresa">TechSoft Solutions S.A.S.</div>
        <div class="logo-linea"></div>
    </div>

    <!-- Mostrar error si existe -->
    <div th:if="${error}" class="alerta alerta-error" th:text="${error}"></div>

    <!-- Formulario de registro (sin CSRF porque está deshabilitado) -->
    <form th:action="@{/registro}" th:object="${usuarioRegistro}" method="post">

        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" th:field="*{nombre}" placeholder="Tu nombre" required autofocus/>

        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" th:field="*{correo}" placeholder="usuario@ejemplo.com" required/>

        <label for="password">Contraseña</label>
        <input type="password" id="password" th:field="*{password}" placeholder="Mínimo 6 caracteres" required/>

        <label for="confirmPassword">Confirmar contraseña</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repite la contraseña" required/>
		
		<label for="rol">Tipo de cuenta</label>
		<select id="rol" name="rol" th:field="*{rol}" required style="width:100%; padding: 11px 16px; background: var(--input-bg); border: 1.5px solid var(--borde); border-radius: 10px; font-family: 'Gabarito', sans-serif; font-size: 14px;">
		    <option value="ROLE_USER">Usuario</option>
		    <option value="ROLE_ADMIN">Administrador</option>
		</select>

        <button type="submit" class="btn-login">Registrarse</button>
    </form>

    <div style="text-align: center; margin-top: 20px;">
        <a th:href="@{/login}">← Volver al inicio de sesión</a>
    </div>

    <div class="footer">SIGPROD · UTS © 2026</div>
</div>
</body>
</html>
