<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Permiso - SIGPROD</title>
    <link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Gabarito', sans-serif; background: #f5f5f5; }
        .header { background: white; border-bottom: 1px solid #e0e0e0; padding: 0 24px; position: fixed; top: 0; left: 0; right: 0; height: 60px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-size: 24px; font-weight: 900; color: #C0392B; }
        .logout-btn { background: #C0392B; color: white; padding: 8px 16px; border-radius: 8px; text-decoration: none; }
        .sidebar { position: fixed; top: 60px; left: 0; width: 250px; height: calc(100vh - 60px); background: white; border-right: 1px solid #e0e0e0; padding: 20px 0; }
        .menu-item { display: block; padding: 12px 24px; color: #555; text-decoration: none; }
        .menu-item:hover { background: #f8e8e6; color: #C0392B; }
        .main { margin-left: 250px; margin-top: 60px; padding: 24px; }
        .card { background: white; border-radius: 12px; padding: 24px; max-width: 500px; margin: 0 auto; }
        .card h2 { margin-bottom: 20px; color: #C0392B; }
        label { display: block; margin-top: 15px; margin-bottom: 5px; font-weight: 500; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; }
        button { background: #C0392B; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; margin-top: 20px; }
        .cancelar { background: #666; margin-left: 10px; text-decoration: none; color: white; padding: 10px 20px; border-radius: 8px; display: inline-block; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">SIGPROD</div>
        <a href="/logout" class="logout-btn">Cerrar Sesión</a>
    </div>
    <div class="sidebar">
        <a href="/admin/dashboard" class="menu-item">Dashboard</a>
        <a href="/admin/usuarios" class="menu-item">Usuarios</a>
        <a href="/admin/roles" class="menu-item">Roles</a>
        <a href="/admin/permisos" class="menu-item">Permisos</a>
    </div>
    <div class="main">
        <div class="card">
            <h2 th:text="${permiso.id != null} ? 'Editar Permiso' : 'Nuevo Permiso'">Formulario</h2>
            
            <form th:unless="${permiso.id}" method="post" action="/admin/permisos/guardar">
                <label>Nombre</label>
                <input type="text" name="nombre" required>
                <small>Ej: VER_USUARIOS, CREAR_PROYECTO</small>
                
                <label>Descripción</label>
                <textarea name="descripcion" rows="3"></textarea>
                
                <label>Módulo</label>
                <select name="modulo" required>
                    <option value="ADMIN">Administración</option>
                    <option value="USUARIOS">Usuarios</option>
                    <option value="ROLES">Roles</option>
                    <option value="PROYECTOS">Proyectos</option>
                </select>
                
                <button type="submit">Guardar</button>
                <a href="/admin/permisos" class="cancelar">Cancelar</a>
            </form>
            
            <form th:if="${permiso.id}" method="post" th:action="@{/admin/permisos/actualizar/{id}(id=${permiso.id})}">
                <label>Nombre</label>
                <input type="text" name="nombre" th:value="${permiso.nombre}" required>
                
                <label>Descripción</label>
                <textarea name="descripcion" rows="3" th:text="${permiso.descripcion}"></textarea>
                
                <label>Módulo</label>
                <select name="modulo" required>
                    <option value="ADMIN" th:selected="${permiso.modulo == 'ADMIN'}">Administración</option>
                    <option value="USUARIOS" th:selected="${permiso.modulo == 'USUARIOS'}">Usuarios</option>
                    <option value="ROLES" th:selected="${permiso.modulo == 'ROLES'}">Roles</option>
                    <option value="PROYECTOS" th:selected="${permiso.modulo == 'PROYECTOS'}">Proyectos</option>
                </select>
                
                <button type="submit">Actualizar</button>
                <a href="/admin/permisos" class="cancelar">Cancelar</a>
            </form>
        </div>
    </div>
</body>
</html>
