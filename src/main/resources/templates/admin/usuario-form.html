<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Usuario - SIGPROD</title>
    <link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Gabarito', sans-serif; background: #f5f5f5; }
        .header { background: white; border-bottom: 1px solid #e0e0e0; padding: 0 24px; position: fixed; top: 0; left: 0; right: 0; height: 60px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-size: 24px; font-weight: 900; color: #C0392B; }
        .logout-btn { background: #C0392B; color: white; padding: 8px 16px; border-radius: 8px; text-decoration: none; }
        .sidebar { position: fixed; top: 60px; left: 0; width: 250px; height: calc(100vh - 60px); background: white; border-right: 1px solid #e0e0e0; padding: 20px 0; }
        .menu-item { display: block; padding: 12px 24px; color: #555; text-decoration: none; }
        .menu-item:hover { background: #f8e8e6; color: #C0392B; }
        .main { margin-left: 250px; margin-top: 60px; padding: 24px; }
        .card { background: white; border-radius: 12px; padding: 24px; max-width: 500px; }
        .card h2 { margin-bottom: 20px; color: #C0392B; }
        label { display: block; margin-top: 15px; margin-bottom: 5px; font-weight: 500; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; }
        button { background: #C0392B; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; margin-top: 20px; }
        .cancelar { background: #666; margin-left: 10px; text-decoration: none; color: white; padding: 10px 20px; border-radius: 8px; display: inline-block; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">SIGPROD</div>
        <a href="/logout" class="logout-btn">Cerrar Sesión</a>
    </div>
    <div class="sidebar">
        <a href="/admin/dashboard" class="menu-item">Dashboard</a>
        <a href="/admin/usuarios" class="menu-item">Usuarios</a>
        <a href="/admin/roles" class="menu-item">Roles</a>
        <a href="/admin/permisos" class="menu-item">Permisos</a>
    </div>
    <div class="main">
        <div class="card">
            <h2 th:text="${usuario.id != null} ? 'Editar Usuario' : 'Nuevo Usuario'">Formulario</h2>
            
            <!-- NUEVO USUARIO -->
            <form th:unless="${usuario.id}" method="post" action="/admin/usuarios/nuevo">
                <label>Nombres</label>
                <input type="text" name="nombres" required>
                
                <label>Apellidos</label>
                <input type="text" name="apellidos" required>
                
                <label>Correo</label>
                <input type="email" name="correo" required>
                
                <label>Contraseña</label>
                <input type="password" name="password" required>
                
                <label>Rol</label>
                <select name="rolNombre" required>
                    <option value="">Seleccione un rol...</option>
                    <option th:each="rol : ${roles}" th:value="${rol.nombre}" th:text="${rol.nombre}"></option>
                </select>
                
                <button type="submit">Guardar Usuario</button>
                <a href="/admin/usuarios" class="cancelar">Cancelar</a>
            </form>
            
            <!-- EDITAR USUARIO -->
            <form th:if="${usuario.id}" method="post" th:action="@{/admin/usuarios/actualizar/{id}(id=${usuario.id})}">
                <label>Nombres</label>
                <input type="text" name="nombres" th:value="${usuario.nombres}" required>
                
                <label>Apellidos</label>
                <input type="text" name="apellidos" th:value="${usuario.apellidos}" required>
                
                <label>Correo</label>
                <input type="email" name="correo" th:value="${usuario.correo}" required>
                
                <label>Rol</label>
                <select name="rolNombre" required>
                    <option th:each="rol : ${roles}" th:value="${rol.nombre}" th:text="${rol.nombre}" th:selected="${usuario.rolNombre == rol.nombre}"></option>
                </select>
                
                <label>Estado</label>
                <select name="estado">
                    <option value="ACTIVO" th:selected="${usuario.estado == 'ACTIVO'}">ACTIVO</option>
                    <option value="INACTIVO" th:selected="${usuario.estado == 'INACTIVO'}">INACTIVO</option>
                </select>
                
                <button type="submit">Actualizar</button>
                <a href="/admin/usuarios" class="cancelar">Cancelar</a>
            </form>
        </div>
    </div>
</body>
</html>
